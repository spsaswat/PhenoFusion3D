[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phenofusion3d"
version = "0.2.0"
description = "RGB-D capture, quality assessment, and 3D plant reconstruction for ANU plant phenotyping"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ANU COMP8715 Plant Phenotyping Team" }
]
license = { text = "MIT" }

dependencies = [
    "open3d>=0.17.0",
    # Headless build on purpose: opencv-python bundles its own Qt
    # platform plugins, which hijack PyQt5's xcb plugin and stop the
    # GUI from opening. The app never calls cv2's GUI functions, so
    # headless loses nothing -- and depending on it directly means no
    # install ever has to be undone afterwards.
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0",
    "natsort>=8.4.0",
    "tqdm>=4.66.0",
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.13.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
# Lab Linux machine: ROS itself is system-installed (apt); rospy comes from
# the ROS distro via PYTHONPATH -- never from pip. But rospy's pure-Python
# deps below ARE official PyPI packages, and they must live in the venv
# because apt installs them only for the system Python 3.8 while the venv
# runs 3.10-3.12.
ros = [
    # Exact pin, deliberately not a range: >=2.55 dropped L515 support
    # entirely, and the wheel must match the machine-wide SDK (2.54.2).
    # See docs/L515_SETUP.md.
    "pyrealsense2==2.54.2.5684",
    "rospkg>=1.5",
    "catkin_pkg>=1.0",
    "PyYAML>=5.1",
    "defusedxml>=0.7",
]
# Windows / dev: camera-only capture, no gantry control
windows = [
    "pyrealsense2==2.54.2.5684",   # see the note on [ros] above
]
# Developer tooling
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]

[project.scripts]
phenofusion3d = "main:main"

[tool.setuptools.packages.find]
include = ["app*", "capture*", "processing*", "file_io*", "visualiser*"]
exclude = ["data*", "stakeholder_reference*", "tests*", "venv*"]
